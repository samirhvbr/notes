# Cargo workspace root.
#
# A crate is created when the milestone that uses it begins (SCOPE §5).
# notes-model, notes-fs and notes-core arrived at 0.1a; notes-markdown at 0.1b,
# with the preview that is its first consumer (ARCHITECTURE.md §17.1);
# notes-index at 0.2; notes-mcp at 0.3; server/ at 0.5.
[workspace]
resolver = "2"
members = ["crates/*", "apps/notes-app/src-tauri", "server/notes-server"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Samir Hanna Verza"]
repository = "https://github.com/samirhvbr/notes"

[workspace.dependencies]
notes-sync = { path = "crates/notes-sync" }
notes-index = { path = "crates/notes-index" }
notes-model = { path = "crates/notes-model" }
notes-fs = { path = "crates/notes-fs" }
notes-core = { path = "crates/notes-core" }
notes-markdown = { path = "crates/notes-markdown" }

pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
# Freedesktop trash on Linux, Recycle Bin on Windows, Finder trash on macOS.
# `ARCHITECTURE.md` §11 promises a trash per backend and §7.7 forbids a silent
# fallback to a permanent delete; the crate is what makes the promise keepable
# and `DeleteOutcome` is what keeps the honesty.
trash = "5"
# The watcher. A stable 8.x rather than the 9 release candidate: this is the
# component that tells the application a file it is holding has changed
# underneath it, and a candidate's behaviour on a backend we cannot test here —
# FSEvents, ReadDirectoryChangesW — is the wrong thing to be finding out from a
# user. `ARCHITECTURE.md` §8's debouncer is written here rather than pulled in,
# because the self-write filter it feeds is ours anyway.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# Windows only, and for exactly one call: `GetFileInformationByHandle`, which is
# the only stable way to read a file's volume serial and index. The standard
# library has the same numbers behind the unstable `windows_by_handle` feature,
# which is what left `native_id` returning `None` on Windows at 0.1a
# (`docs/DECISIONS-0.1a.md` D-24). Without them, identity correlation after an
# external rename falls back to the content hash and mints a new `NoteId`.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
blake3 = "1"
dirs = "6"
fd-lock = "4"
ts-rs = { version = "10", features = ["serde-compat"] }
tempfile = "3"
ignore = "0.4"
regex = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
