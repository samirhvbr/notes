# Dependabot keeps the only dependency surface this repository has — the
# actions used by any future workflow — from going stale.
#
# There is deliberately NO build workflow here: repodocs holds documentation,
# shell hooks and templates, so a CI job would have nothing to prove. A red CI
# on a docs repo teaches people to ignore CI, which is worse than no CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      # The fleet commit format is `versão - comentário em português`, which
      # Dependabot cannot produce. `prefix` is the closest it gets; a
      # Dependabot PR is therefore squashed by hand with a conforming message.
      prefix: "deps"
    open-pull-requests-limit: 5
